<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Secure payment</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    :root{--bg:#09090f;--panel:#111118;--panel2:#171720;--border:#292936;--text:#f3f3f7;--muted:#9292a2;--accent:#685bff;--accent2:#7b70ff;--green:#00cf7a;--red:#ff676d;--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:radial-gradient(circle at 18% 2%,rgba(104,91,255,.14),transparent 34%),var(--bg);color:var(--text);font-family:var(--sans)}
    body{display:grid;place-items:center;padding:32px 18px}
    main{width:min(100%,520px);margin:auto}
    .card{width:100%;background:rgba(17,17,24,.97);border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.32)}
    .merchant{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
    .merchant-icon{width:34px;height:34px;border:1px solid #343442;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:#c8c7d3}
    .merchant-name{font-size:16px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
    .amount-title{text-align:center;font-size:23px;font-weight:750;letter-spacing:-.025em;margin:0 0 22px}
    #checkout-form{border-top:1px solid var(--border);padding-top:22px}
    .section-title{font-size:15px;font-weight:700;margin:0 0 16px}
    .section{border-top:1px solid var(--border);padding-top:22px;margin-top:7px}
    label{display:block;font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--text);margin:0 0 8px}
    input,select{width:100%;height:46px;border:1px solid #343442;border-radius:10px;background:var(--panel2);color:var(--text);padding:0 13px;font:500 14px var(--sans);outline:none;transition:border-color .16s,box-shadow .16s}
    select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9292a2 50%),linear-gradient(135deg,#9292a2 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
    input:focus,select:focus{border-color:#6e63ff;box-shadow:0 0 0 3px rgba(104,91,255,.15)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{margin-bottom:16px}
    .optional{font-size:10px;color:#777787;letter-spacing:0;text-transform:none;font-weight:600}
    button{width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:white;font:700 14px var(--sans);cursor:pointer;transition:background .16s,transform .08s,opacity .16s}
    button:hover:not(:disabled){background:var(--accent2)}
    button:active:not(:disabled){transform:translateY(1px)}
    button:disabled{opacity:.55;cursor:not-allowed}
    #express-wrap{display:none;margin-bottom:18px}
    #address-element{margin-bottom:16px}
    .divider{display:flex;align-items:center;gap:12px;color:#777787;font-size:11px;margin:17px 0}
    .divider:before,.divider:after{content:"";height:1px;background:var(--border);flex:1}
    #payment-element{min-height:120px;margin-bottom:18px}
    .message{display:none;border-radius:10px;padding:12px 13px;font-size:13px;line-height:1.45;margin-bottom:16px}
    .message.error{display:block;background:rgba(255,103,109,.09);border:1px solid rgba(255,103,109,.28);color:#ff9ca0}
    .message.success{display:block;background:rgba(0,207,122,.08);border:1px solid rgba(0,207,122,.25);color:#62e7ad}
    .loading{min-height:250px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
    .spinner{width:18px;height:18px;border:2px solid #343442;border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite;margin-right:9px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .complete{text-align:center;padding:32px 8px 26px;display:none}
    .check{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:rgba(0,207,122,.11);color:var(--green);border:1px solid rgba(0,207,122,.25)}
    .complete h2{font-size:21px;margin:0 0 8px}
    .complete p{color:var(--muted);font-size:13px;line-height:1.55;margin:0}
    .powered{display:flex;align-items:center;justify-content:center;gap:6px;color:#737383;font-size:11px;margin-top:18px}
    .stripe-logo{display:block;width:38px;height:auto;opacity:1}
    @media(max-width:560px){body{display:block;padding:18px 12px}.card{padding:21px;border-radius:16px}.form-row{grid-template-columns:1fr;gap:0}.amount-title{font-size:21px}}
  </style>
</head>
<body>
  <main>
    <section class="card" id="checkout-card">
      <div id="loading" class="loading"><span class="spinner"></span>Loading secure payment…</div>
      <div id="error-message" class="message"></div>

      <div id="checkout-content" hidden>
        <div class="merchant">
          <span class="merchant-icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9.5 4.5 4h15L21 9.5"/><path d="M5 13v7h14v-7"/><path d="M9 20v-5h6v5"/>
              <path d="M3 9.5a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/>
            </svg>
          </span>
          <span class="merchant-name" id="shop-name">Shop</span>
        </div>
        <h1 class="amount-title">Payment of <span id="payment-amount"></span></h1>

        <form id="checkout-form">
          <h2 class="section-title">Customer details</h2>
          <div id="address-element"></div>
          <div class="field"><label for="customer-email">Email address</label><input id="customer-email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
          <div class="field"><label for="customer-phone">Phone <span class="optional">(optional)</span></label><input id="customer-phone" name="tel" type="tel" autocomplete="tel" maxlength="50"></div>

          <div class="section">
            <h2 class="section-title">Payment method</h2>
            <div id="express-wrap">
              <div id="express-checkout-element"></div>
              <div class="divider">Or pay another way</div>
            </div>
            <div id="payment-message" class="message"></div>
            <div id="payment-element"></div>
            <button id="pay-button" type="submit" disabled>Pay securely</button>
          </div>
        </form>
      </div>

      <div id="complete" class="complete">
        <div class="check"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 12 4 4L19 6"/></svg></div>
        <h2>Payment successful</h2>
        <p>Your payment was completed successfully.</p>
      </div>

  <script>
    (function(){
      'use strict';
      var pathParts=location.pathname.split('/').filter(Boolean);
      var slug=pathParts[0]==='pay' ? pathParts[1] : '';
      var config=null,stripe=null,elements=null,addressElement=null,paymentElement=null,expressElement=null,confirmationType='payment',processing=false;
      var payButtonLabel='Pay securely';
      var loading=document.getElementById('loading');
      var checkoutContent=document.getElementById('checkout-content');
      var checkoutForm=document.getElementById('checkout-form');
      var complete=document.getElementById('complete');
      var errorMessage=document.getElementById('error-message');
      var paymentMessage=document.getElementById('payment-message');
      var payButton=document.getElementById('pay-button');
      var expressWrap=document.getElementById('express-wrap');
      document.querySelector('.powered span').textContent='Payments securely processed by';

      function showMessage(element,text,type){element.textContent=text||'';element.className='message'+(text?' '+(type||'error'):'');}
      function money(amount,currency){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:String(currency||'usd').toUpperCase()}).format(Number(amount||0)/100);}catch(_err){return (Number(amount||0)/100).toFixed(2)+' '+String(currency||'usd').toUpperCase();}}
      function randomReference(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return 'checkout-'+Date.now()+'-'+Math.random().toString(36).slice(2,12);}
      function referenceFor(email){var key='subloop_checkout_'+slug;try{var saved=JSON.parse(sessionStorage.getItem(key)||'null');if(saved&&saved.email===email&&saved.reference)return saved.reference;var reference=randomReference();sessionStorage.setItem(key,JSON.stringify({email:email,reference:reference}));return reference;}catch(_err){return randomReference();}}
      function clearReference(){try{sessionStorage.removeItem('subloop_checkout_'+slug);}catch(_err){}}
      function showComplete(){loading.style.display='none';checkoutContent.hidden=true;showMessage(errorMessage,'');complete.style.display='block';clearReference();}
      function setProcessing(active){processing=active;payButton.disabled=active;payButton.textContent=active?'Processing…':payButtonLabel;}
      function customerFromForm(){
        if(!addressElement)return Promise.reject(new Error('The address form is not ready. Please refresh the page.'));
        return addressElement.getValue().then(function(result){
          if(!result.complete)throw new Error('Please complete your name and billing address.');
          var value=result.value||{};
          var parsed=splitName(value.name);
          var firstName=String(value.firstName||parsed.first||'').trim();
          var lastName=String(value.lastName||parsed.last||'').trim();
          return {
            name:String(value.name||(firstName+' '+lastName)).trim(),
            first_name:firstName,
            last_name:lastName,
            email:document.getElementById('customer-email').value.trim().toLowerCase(),
            phone:document.getElementById('customer-phone').value.trim()||null,
            address:value.address||{}
          };
        });
      }
      function splitName(name){
        var parts=String(name||'').trim().split(/\s+/).filter(Boolean);
        return {first:parts.shift()||'',last:parts.join(' ')||''};
      }
      function customerFromWallet(event){
        var details=event&&event.billingDetails?event.billingDetails:{};
        var parsed=splitName(details.name);
        return {
          name:String(details.name||'').trim(),
          first_name:parsed.first,
          last_name:parsed.last,
          email:String(details.email||'').trim().toLowerCase(),
          phone:details.phone||document.getElementById('customer-phone').value.trim()||null,
          address:details.address||{}
        };
      }
      function statusFromReturn(){
        var params=new URLSearchParams(location.search);
        var paymentSecret=params.get('payment_intent_client_secret');
        var setupSecret=params.get('setup_intent_client_secret');
        if(!stripe||(!paymentSecret&&!setupSecret))return Promise.resolve(false);
        var request=paymentSecret?stripe.retrievePaymentIntent(paymentSecret):stripe.retrieveSetupIntent(setupSecret);
        return request.then(function(result){
          var intent=result.paymentIntent||result.setupIntent;
          if(intent&&['succeeded','processing'].indexOf(intent.status)>=0){showComplete();return true;}
          if(intent&&intent.status==='requires_payment_method')showMessage(errorMessage,'The payment was not completed. Please try another payment method.','error');
          return false;
        }).catch(function(){return false;});
      }
      function createSubscription(customer){
        return fetch('/checkout/create-subscription',{
          method:'POST',
          headers:{'Content-Type':'application/json',Accept:'application/json'},
          body:JSON.stringify({token:config.embedToken,checkout_reference:referenceFor(customer.email),hosted_checkout:true,customer:customer})
        }).then(function(response){return response.json().then(function(body){if(!response.ok)throw new Error(body.error||'Could not prepare payment');return body;});});
      }
      function confirmSubscription(result,billingDetails){
        if(!result.clientSecret||result.type==='none')throw new Error('Stripe did not return a payment confirmation. Please contact the merchant.');
        confirmationType=result.type||'payment';
        var confirmParams={return_url:location.origin+location.pathname+'?complete=1',payment_method_data:{billing_details:billingDetails}};
        var request=confirmationType==='setup'
          ? stripe.confirmSetup({elements:elements,clientSecret:result.clientSecret,confirmParams:confirmParams,redirect:'if_required'})
          : stripe.confirmPayment({elements:elements,clientSecret:result.clientSecret,confirmParams:confirmParams,redirect:'if_required'});
        return request.then(function(confirmResult){if(confirmResult.error)throw confirmResult.error;showComplete();});
      }
      function prepareAndConfirm(customer){
        if(!customer.email||customer.email.indexOf('@')<1)throw new Error('A valid email address is required.');
        if(!customer.name)throw new Error('Your name is required.');
        if(!customer.address||!customer.address.line1||!customer.address.country)throw new Error('A complete billing address is required.');
        var billingDetails={name:customer.name,email:customer.email,address:customer.address};
        if(customer.phone)billingDetails.phone=customer.phone;
        return createSubscription(customer).then(function(result){return confirmSubscription(result,billingDetails);});
      }
      function showExpressMethods(methods){
        var hasMethods=methods&&Object.keys(methods).some(function(key){return !!methods[key];});
        expressWrap.style.display=hasMethods?'block':'none';
      }
      function mountPaymentMethods(){
        var appearance={theme:'night',variables:{colorPrimary:'#f3f3f7',colorBackground:'#171720',colorText:'#f3f3f7',colorDanger:'#ff676d',borderRadius:'10px',fontFamily:'Inter, ui-sans-serif, system-ui, sans-serif'}};
        elements=stripe.elements({mode:'subscription',amount:Number(config.amount),currency:String(config.currency||'usd').toLowerCase(),appearance:appearance});
        addressElement=elements.create('address',{mode:'billing',display:{name:'split'},fields:{phone:'never'}});
        addressElement.mount('#address-element');
        expressElement=elements.create('expressCheckout',{
          emailRequired:true,
          billingAddressRequired:true,
          business:{name:config.shopName||'Shop'},
          lineItems:[{name:'Payment',amount:Number(config.amount)}],
          buttonHeight:46,
          layout:{maxColumns:2,maxRows:2,overflow:'auto'}
        });
        expressElement.mount('#express-checkout-element');
        expressElement.on('ready',function(event){showExpressMethods(event&&event.availablePaymentMethods);});
        expressElement.on('availablepaymentmethodschange',function(event){showExpressMethods(event&&event.paymentMethods);});
        expressElement.on('confirm',function(event){
          if(processing)return;
          showMessage(paymentMessage,'');
          setProcessing(true);
          var customer=customerFromWallet(event);
          prepareAndConfirm(customer).catch(function(error){showMessage(paymentMessage,error.message||'Your payment could not be completed.','error');setProcessing(false);});
        });

        paymentElement=elements.create('payment',{
          layout:'accordion',
          terms:{card:'never'},
          fields:{billingDetails:{name:'never',email:'never',phone:'never',address:'never'}}
        });
        paymentElement.mount('#payment-element');
        paymentElement.on('ready',function(){if(!processing)payButton.disabled=false;});
      }

      fetch('/checkout/hosted/'+encodeURIComponent(slug)+'/config',{headers:{Accept:'application/json'}})
        .then(function(response){return response.json().then(function(body){if(!response.ok)throw new Error(body.error||'Checkout unavailable');return body;});})
        .then(function(body){
          config=body;
          if(!window.Stripe)throw new Error('Secure payment form could not load. Please refresh the page.');
          stripe=Stripe(config.publishableKey);
          var amountLabel=money(config.amount,config.currency);
          document.getElementById('shop-name').textContent=config.shopName||'Shop';
          document.getElementById('payment-amount').textContent=amountLabel;
          document.title='Payment of '+amountLabel+' · '+(config.shopName||'Shop');
          payButtonLabel='Pay '+amountLabel;
          payButton.textContent=payButtonLabel;
          loading.style.display='none';
          checkoutContent.hidden=false;
          return statusFromReturn().then(function(done){if(!done)mountPaymentMethods();});
        })
        .catch(function(error){loading.style.display='none';showMessage(errorMessage,error.message||'This checkout link is unavailable.','error');});

      checkoutForm.addEventListener('submit',function(event){
        event.preventDefault();
        showMessage(paymentMessage,'');
        if(!stripe||!elements||processing||payButton.disabled||!checkoutForm.reportValidity())return;
        setProcessing(true);
        elements.submit()
          .then(function(result){if(result.error)throw result.error;return customerFromForm();})
          .then(function(customer){return prepareAndConfirm(customer);})
          .catch(function(error){showMessage(paymentMessage,error.message||'Your payment could not be completed.','error');setProcessing(false);});
      });
    })();
  </script>
</body>
</html>
