<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Secure checkout · Subloop</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    :root{--bg:#09090f;--panel:#111118;--panel2:#171720;--border:#292936;--text:#f3f3f7;--muted:#9292a2;--accent:#685bff;--accent2:#7b70ff;--green:#00cf7a;--red:#ff676d;--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:radial-gradient(circle at 18% 2%,rgba(104,91,255,.14),transparent 34%),var(--bg);color:var(--text);font-family:var(--sans)}
    body{display:grid;place-items:center;padding:32px 18px}
    main{width:min(100%,480px);margin:auto}
    .card{width:100%;background:rgba(17,17,24,.97);border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.32)}
    .card-title{font-size:19px;font-weight:700;margin:0 0 5px}
    .card-sub{font-size:13px;color:var(--muted);margin:0 0 22px;line-height:1.45}
    label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#aaa9ba;margin:0 0 8px}
    input,select{width:100%;height:46px;border:1px solid #343442;border-radius:10px;background:var(--panel2);color:var(--text);padding:0 13px;font:500 14px var(--sans);outline:none;transition:border-color .16s,box-shadow .16s}
    select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9292a2 50%),linear-gradient(135deg,#9292a2 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
    input:focus,select:focus{border-color:#6e63ff;box-shadow:0 0 0 3px rgba(104,91,255,.15)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{margin-bottom:16px}
    .optional{font-size:10px;color:#777787;letter-spacing:0;text-transform:none;font-weight:600}
    button{width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:white;font:700 14px var(--sans);cursor:pointer;transition:background .16s,transform .08s,opacity .16s}
    button:hover:not(:disabled){background:var(--accent2)}
    button:active:not(:disabled){transform:translateY(1px)}
    button:disabled{opacity:.55;cursor:not-allowed}
    #payment-step{display:none}
    #payment-element{min-height:120px;margin-bottom:18px}
    .back{width:auto;height:auto;background:none;padding:0;color:#aaa9ba;font-size:12px;margin:0 0 18px;text-align:left}
    .back:hover:not(:disabled){background:none;color:white}
    .message{display:none;border-radius:10px;padding:12px 13px;font-size:13px;line-height:1.45;margin-bottom:16px}
    .message.error{display:block;background:rgba(255,103,109,.09);border:1px solid rgba(255,103,109,.28);color:#ff9ca0}
    .message.success{display:block;background:rgba(0,207,122,.08);border:1px solid rgba(0,207,122,.25);color:#62e7ad}
    .loading{min-height:250px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
    .spinner{width:18px;height:18px;border:2px solid #343442;border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite;margin-right:9px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .complete{text-align:center;padding:32px 8px 26px;display:none}
    .check{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:rgba(0,207,122,.11);color:var(--green);border:1px solid rgba(0,207,122,.25)}
    .complete h2{font-size:21px;margin:0 0 8px}
    .complete p{color:var(--muted);font-size:13px;line-height:1.55;margin:0}
    .powered{text-align:center;color:#737383;font-size:11px;margin-top:18px}
    .powered strong{color:#aaa9ba;font-weight:650}
    @media(max-width:520px){body{display:block;padding:18px 12px}.card{padding:21px;border-radius:16px}.form-row{grid-template-columns:1fr;gap:0}}
  </style>
</head>
<body>
  <main>
    <section class="card" id="checkout-card">
      <div id="loading" class="loading"><span class="spinner"></span>Loading secure checkout…</div>
      <div id="error-message" class="message"></div>

      <form id="customer-step" hidden>
        <h2 class="card-title">Your information</h2>
        <p class="card-sub">Enter your contact and billing information.</p>
        <div class="form-row">
          <div class="field"><label for="first-name">First name</label><input id="first-name" name="given-name" autocomplete="given-name" maxlength="100" required></div>
          <div class="field"><label for="last-name">Last name</label><input id="last-name" name="family-name" autocomplete="family-name" maxlength="100" required></div>
        </div>
        <div class="field"><label for="customer-email">Email address</label><input id="customer-email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
        <div class="field"><label for="customer-phone">Phone <span class="optional">(optional)</span></label><input id="customer-phone" name="tel" type="tel" autocomplete="tel" maxlength="50"></div>
        <div class="field"><label for="address-line1">Address</label><input id="address-line1" name="address-line1" autocomplete="address-line1" maxlength="200" required></div>
        <div class="field"><label for="address-line2">Apartment or suite <span class="optional">(optional)</span></label><input id="address-line2" name="address-line2" autocomplete="address-line2" maxlength="200"></div>
        <div class="form-row">
          <div class="field"><label for="address-city">City</label><input id="address-city" name="address-level2" autocomplete="address-level2" maxlength="100" required></div>
          <div class="field"><label for="address-postal">Postal code</label><input id="address-postal" name="postal-code" autocomplete="postal-code" maxlength="40" required></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="address-state">State / province <span class="optional">(optional)</span></label><input id="address-state" name="address-level1" autocomplete="address-level1" maxlength="100"></div>
          <div class="field"><label for="address-country">Country</label><select id="address-country" name="country" autocomplete="country" required><option value="">Select country</option></select></div>
        </div>
        <button id="continue-button" type="submit">Continue to payment</button>
      </form>

      <form id="payment-step">
        <button type="button" class="back" id="back-button">← Change customer information</button>
        <h2 class="card-title">Payment details</h2>
        <p class="card-sub">Complete your subscription using a secure card payment.</p>
        <div id="payment-message" class="message"></div>
        <div id="payment-element"></div>
        <button id="pay-button" type="submit" disabled>Subscribe securely</button>
      </form>

      <div id="complete" class="complete">
        <div class="check"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m5 12 4 4L19 6"/></svg></div>
        <h2>Payment successful</h2>
        <p>Your subscription has been created. A confirmation will be sent by the merchant.</p>
      </div>
      <div class="powered">Powered securely by <strong>Stripe</strong></div>
    </section>
  </main>

  <script>
    (function(){
      'use strict';
      var pathParts=location.pathname.split('/').filter(Boolean);
      var slug=pathParts[0]==='pay' ? pathParts[1] : '';
      var config=null,stripe=null,elements=null,paymentElement=null,confirmationType='payment';
      var customerBillingDetails=null,payButtonLabel='Subscribe securely';
      var loading=document.getElementById('loading');
      var customerStep=document.getElementById('customer-step');
      var paymentStep=document.getElementById('payment-step');
      var complete=document.getElementById('complete');
      var errorMessage=document.getElementById('error-message');
      var paymentMessage=document.getElementById('payment-message');
      var continueButton=document.getElementById('continue-button');
      var payButton=document.getElementById('pay-button');

      function showMessage(element,text,type){element.textContent=text||'';element.className='message'+(text?' '+(type||'error'):'');}
      function money(amount,currency){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:String(currency||'usd').toUpperCase()}).format(Number(amount||0)/100);}catch(_err){return (Number(amount||0)/100).toFixed(2)+' '+String(currency||'usd').toUpperCase();}}
      var countryCodes=('AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BV BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GS GT GU GW GY HK HM HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TF TG TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG UM US UY UZ VA VC VE VG VI VN VU WF WS YE YT ZA ZM ZW').split(' ');
      function populateCountries(){
        var select=document.getElementById('address-country');
        var displayNames=null;
        try{displayNames=new Intl.DisplayNames([navigator.language||'en'],{type:'region'});}catch(_err){}
        var countries=countryCodes.map(function(code){return {code:code,label:displayNames?displayNames.of(code):code};});
        countries.sort(function(a,b){return a.label.localeCompare(b.label);});
        countries.forEach(function(country){var option=document.createElement('option');option.value=country.code;option.textContent=country.label;select.appendChild(option);});
        var localeMatch=String(navigator.language||'').match(/[-_]([A-Za-z]{2})$/);
        if(localeMatch&&countryCodes.indexOf(localeMatch[1].toUpperCase())>=0)select.value=localeMatch[1].toUpperCase();
      }
      function randomReference(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return 'checkout-'+Date.now()+'-'+Math.random().toString(36).slice(2,12);}
      function referenceFor(email){var key='subloop_checkout_'+slug;try{var saved=JSON.parse(sessionStorage.getItem(key)||'null');if(saved&&saved.email===email&&saved.reference)return saved.reference;var reference=randomReference();sessionStorage.setItem(key,JSON.stringify({email:email,reference:reference}));return reference;}catch(_err){return randomReference();}}
      function clearReference(){try{sessionStorage.removeItem('subloop_checkout_'+slug);}catch(_err){}}
      function showComplete(){loading.style.display='none';customerStep.hidden=true;paymentStep.style.display='none';showMessage(errorMessage,'');complete.style.display='block';clearReference();}
      function resetPaymentElement(){
        if(paymentElement){try{paymentElement.unmount();}catch(_err){}try{paymentElement.destroy();}catch(_err){}}
        paymentElement=null;elements=null;payButton.disabled=true;document.getElementById('payment-element').innerHTML='';
      }
      function statusFromReturn(){
        var params=new URLSearchParams(location.search);
        var paymentSecret=params.get('payment_intent_client_secret');
        var setupSecret=params.get('setup_intent_client_secret');
        if(!stripe||(!paymentSecret&&!setupSecret))return Promise.resolve(false);
        var request=paymentSecret?stripe.retrievePaymentIntent(paymentSecret):stripe.retrieveSetupIntent(setupSecret);
        return request.then(function(result){
          var intent=result.paymentIntent||result.setupIntent;
          if(intent&&['succeeded','processing'].indexOf(intent.status)>=0){showComplete();return true;}
          if(intent&&intent.status==='requires_payment_method')showMessage(errorMessage,'The payment was not completed. Please try another card.','error');
          return false;
        }).catch(function(){return false;});
      }

      populateCountries();

      fetch('/checkout/hosted/'+encodeURIComponent(slug)+'/config',{headers:{Accept:'application/json'}})
        .then(function(response){return response.json().then(function(body){if(!response.ok)throw new Error(body.error||'Checkout unavailable');return body;});})
        .then(function(body){
          config=body;
          if(!window.Stripe)throw new Error('Secure payment form could not load. Please refresh the page.');
          stripe=Stripe(config.publishableKey);
          payButtonLabel='Subscribe securely · '+money(config.amount,config.currency);
          payButton.textContent=payButtonLabel;
          loading.style.display='none';customerStep.hidden=false;
          return statusFromReturn();
        })
        .catch(function(error){loading.style.display='none';showMessage(errorMessage,error.message||'This checkout link is unavailable.','error');});

      customerStep.addEventListener('submit',function(event){
        event.preventDefault();showMessage(errorMessage,'');
        if(!customerStep.reportValidity()||!config||!stripe)return;
        var firstName=document.getElementById('first-name').value.trim();
        var lastName=document.getElementById('last-name').value.trim();
        var name=(firstName+' '+lastName).trim();
        var email=document.getElementById('customer-email').value.trim().toLowerCase();
        var phone=document.getElementById('customer-phone').value.trim();
        var address={
          line1:document.getElementById('address-line1').value.trim(),
          line2:document.getElementById('address-line2').value.trim(),
          city:document.getElementById('address-city').value.trim(),
          postal_code:document.getElementById('address-postal').value.trim(),
          state:document.getElementById('address-state').value.trim(),
          country:document.getElementById('address-country').value
        };
        customerBillingDetails={name:name,email:email,address:address};
        if(phone)customerBillingDetails.phone=phone;
        continueButton.disabled=true;continueButton.textContent='Preparing payment…';
        fetch('/checkout/create-subscription',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({token:config.embedToken,checkout_reference:referenceFor(email),customer:{name:name,first_name:firstName,last_name:lastName,email:email,phone:phone||null,address:address}})})
          .then(function(response){return response.json().then(function(body){if(!response.ok)throw new Error(body.error||'Could not prepare payment');return body;});})
          .then(function(result){
            if(!result.clientSecret||result.type==='none')throw new Error('Stripe did not return a payment confirmation. Please contact the merchant.');
            confirmationType=result.type||'payment';
            resetPaymentElement();
            elements=stripe.elements({clientSecret:result.clientSecret,appearance:{theme:'night',variables:{colorPrimary:'#685bff',colorBackground:'#171720',colorText:'#f3f3f7',colorDanger:'#ff676d',borderRadius:'10px',fontFamily:'Inter, ui-sans-serif, system-ui, sans-serif'}}});
            paymentElement=elements.create('payment',{layout:'tabs',terms:{card:'never'},fields:{billingDetails:{name:'never',email:'never',phone:'never',address:'never'}}});
            paymentElement.mount('#payment-element');
            paymentElement.on('ready',function(){payButton.disabled=false;});
            customerStep.hidden=true;paymentStep.style.display='block';
          })
          .catch(function(error){showMessage(errorMessage,error.message||'Could not prepare payment.','error');})
          .finally(function(){continueButton.disabled=false;continueButton.textContent='Continue to payment';});
      });

      document.getElementById('back-button').addEventListener('click',function(){paymentStep.style.display='none';customerStep.hidden=false;});
      paymentStep.addEventListener('submit',function(event){
        event.preventDefault();if(!stripe||!elements||payButton.disabled)return;
        showMessage(paymentMessage,'');payButton.disabled=true;payButton.textContent='Processing…';
        var confirmParams={return_url:location.origin+location.pathname+'?complete=1',payment_method_data:{billing_details:customerBillingDetails}};
        var request=confirmationType==='setup'
          ? stripe.confirmSetup({elements:elements,confirmParams:confirmParams,redirect:'if_required'})
          : stripe.confirmPayment({elements:elements,confirmParams:confirmParams,redirect:'if_required'});
        request.then(function(result){if(result.error)throw result.error;showComplete();}).catch(function(error){showMessage(paymentMessage,error.message||'Your payment could not be completed.','error');payButton.disabled=false;payButton.textContent=payButtonLabel;});
      });
    })();
  </script>
</body>
</html>
